<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="MagGoTzYT: I build software that fixes things">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181C"/>
      <stop offset="1" stop-color="#0E0F12"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8C33"/>
      <stop offset="1" stop-color="#FFC266"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8C33" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FF8C33" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FF8C33" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
    <style>
      .t{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
      .m{font-family:'Cascadia Mono',Consolas,'SFMono-Regular',Menlo,monospace}
      .sweep{animation:sweep 5.5s cubic-bezier(.6,0,.4,1) infinite}
      @keyframes sweep{0%{transform:translateX(-320px)}60%,100%{transform:translateX(1240px)}}
      .ring{stroke-dasharray:302;stroke-dashoffset:302;animation:fill 2.4s .3s cubic-bezier(.2,.8,.2,1) forwards}
      @keyframes fill{to{stroke-dashoffset:0}}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .spark{animation:rise 3.6s ease-in infinite;opacity:0}
      .s2{animation-delay:1.2s}.s3{animation-delay:2.4s}
      @keyframes rise{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
      @media (prefers-reduced-motion:reduce){.sweep,.spark,.blink{animation:none}.ring{animation:none;stroke-dashoffset:0}}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect class="sweep" x="0" y="0" width="300" height="300" fill="url(#scan)"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#heat)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="18" fill="none" stroke="#2A2D33"/>

  <!-- left: name -->
  <text class="m" x="64" y="86" font-size="15" fill="#8B919A" letter-spacing="2">~/ABOUT</text>
  <text class="t" x="60" y="166" font-size="76" font-weight="700" fill="#F3F3F3" letter-spacing="-1.5">MagGoTzYT</text>
  <text class="t" x="64" y="208" font-size="24" fill="#C8C8C8">I build software that <tspan fill="url(#heat)" font-weight="600">fixes things</tspan>.</text>
  <text class="m" x="64" y="252" font-size="15" fill="#8B919A">&gt; shipping something new<tspan class="blink" fill="#FF8C33">_</tspan></text>

  <!-- right: health ring -->
  <g transform="translate(1010 150)">
    <circle r="48" fill="none" stroke="#24272D" stroke-width="10"/>
    <circle class="ring" r="48" fill="none" stroke="url(#heat)" stroke-width="10" stroke-linecap="round" transform="rotate(-90)"/>
    <text class="t" y="9" font-size="30" font-weight="700" fill="#F3F3F3" text-anchor="middle">2.0</text>
    <text class="m" y="84" font-size="12" fill="#8B919A" text-anchor="middle" letter-spacing="1.5">VERSION</text>
    <circle class="spark" cx="-30" cy="-58" r="2.5" fill="#FFC266"/>
    <circle class="spark s2" cx="22" cy="-62" r="2" fill="#FF8C33"/>
    <circle class="spark s3" cx="-4" cy="-66" r="1.8" fill="#FFC266"/>
  </g>
</svg>
